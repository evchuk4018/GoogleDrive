services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-googledrive}
      POSTGRES_USER: ${POSTGRES_USER:-googledrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - /srv/storage/googledrive/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_DRIVE_BASE_PATH: /drive
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_DRIVE_BASE_PATH: /drive
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      DRIVE_STORAGE_ROOT: /srv/storage/googledrive/files
      DRIVE_MAX_UPLOAD_BYTES: ${DRIVE_MAX_UPLOAD_BYTES:-1073741824}
      DRIVE_MAX_MCP_WRITE_BYTES: ${DRIVE_MAX_MCP_WRITE_BYTES:-8388608}
      DRIVE_MCP_MAX_READ_BYTES: ${DRIVE_MCP_MAX_READ_BYTES:-262144}
      DRIVE_DB_POOL_MAX: ${DRIVE_DB_POOL_MAX:-10}
    ports:
      - "127.0.0.1:3080:3000"
    volumes:
      - /srv/storage/googledrive/files:/srv/storage/googledrive/files
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
